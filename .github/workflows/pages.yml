name: Deploy JKT48 Replay to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Restore data bake terakhir agar situs tetap tayang saat API JKT48Connect sedang down
      - name: Restore last static data cache
        uses: actions/cache@v4
        with:
          path: public/static-data
          key: static-data-${{ github.run_id }}
          restore-keys: static-data-

      - name: Generate latest JKT48 Replay & Member Static Data
        env:
          JKT48CONNECT_API_KEY: ${{ secrets.JKT48CONNECT_API_KEY }}
        run: node scripts/update-static-data.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

